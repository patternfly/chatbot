# Harness overlay for the review agent.
# Base: fullsend-ai/agents v0.57.1 (matches the repo's fullsend workflow pin).
# Per-key merge: unset keys inherit from the base harness (ADR 0045/0055).
base: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/review.yaml#sha256=c31ab2ff59b288ad1b8e3755751549c00c1606649cdb239bbbe5df58ba6f3112

forge:
  github:
    env:
      runner:
        # Skip dependency-bot PRs entirely (cost lever).
        REVIEW_SKIP_AUTHORS: "app/renovate,app/dependabot"
        # Risk verdict gate: withhold bot approval at risk score >= 3
        # (default 4). Conservative while trust builds; loosen to "4"
        # once the team is familiar with the risk judgment.
        REVIEW_RISK_VERDICT_THRESHOLD: "3"
        # Protected paths: the v0.52.0 harness defaults plus .fullsend/
        # (the directory that configures the agents themselves).
        # Changes under these paths cannot be approved by the agent.
        REVIEW_PROTECTED_PATHS: ".claude/,.cursor/,.pi/,.gitattributes,.gitignore,.github/,.fullsend/,.pre-commit-config.yaml,AGENTS.md,agents/,api-servers/,CLAUDE.md,CODEOWNERS,Containerfile,Dockerfile,harness/,images/,plugins/,policies/,profiles/,providers/,scripts/,skills/"
      sandbox:
        REVIEW_SKIP_AUTHORS: "app/renovate,app/dependabot"
        REVIEW_RISK_VERDICT_THRESHOLD: "3"
        REVIEW_PROTECTED_PATHS: ".claude/,.cursor/,.pi/,.gitattributes,.gitignore,.github/,.fullsend/,.pre-commit-config.yaml,AGENTS.md,agents/,api-servers/,CLAUDE.md,CODEOWNERS,Containerfile,Dockerfile,harness/,images/,plugins/,policies/,profiles/,providers/,scripts/,skills/"
